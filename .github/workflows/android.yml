name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'docs/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # publishes the APK as a GitHub Release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    # Pinned: this image ships the Android SDK (ubuntu-latest is moving to a new image).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          set +e
          gradle --project-dir android assembleRelease --no-daemon > gradle.log 2>&1
          status=$?
          set -e
          cat gradle.log
          if [ "$status" -ne 0 ]; then
            # Repeat the essential lines as an annotation, which is readable without opening the log.
            grep -nE "error:|e: |What went wrong|Caused by|FAILED|SDK location|Execution failed|Could not" -A4 gradle.log | head -n 80 > failure.txt || true
            [ -s failure.txt ] || tail -n 60 gradle.log > failure.txt
            message=$(sed -e 's/%/%25/g' -e 's/\r//g' failure.txt | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=Gradle build failed::${message}"
            exit "$status"
          fi

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kinetic.apk
          ls -l kinetic.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kinetic-apk
          path: kinetic.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --cleanup-tag --yes || true
          gh release create android kinetic.apk \
            --target "$GITHUB_SHA" \
            --title "Kinetic for Android (build ${{ github.run_number }})" \
            --notes "Install: open this page on the Android phone, download kinetic.apk and open it. Allow installing apps from your browser when Android asks. Later builds install over this one and keep your data."
